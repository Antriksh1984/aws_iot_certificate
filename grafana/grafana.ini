# Local Grafana for the iot-project demo. Started by grafana/start.ps1, which sets the
# GF_PATHS_* variables and the values used by the provisioning files.

[server]
http_addr = 127.0.0.1
http_port = 3000

[users]
default_theme = dark

# Anyone on this machine can view the dashboard without logging in (presentation mode).
# Log in as admin (default password "admin", Grafana asks you to change it) to edit.
[auth.anonymous]
enabled = true
org_role = Viewer

[aws]
allowed_auth_providers = default
assume_role_enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false
